name: dbt build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: learning
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d learning"
          --health-interval 2s
          --health-retries 15

    env:
      DBT_PROFILES_DIR: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Check the generator reproduces the committed seeds
        run: |
          python scripts/generate_data.py
          git diff --exit-code seeds/

      - name: dbt build
        run: dbt build
