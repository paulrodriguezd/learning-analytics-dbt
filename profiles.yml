# Connection to the local Postgres started by docker-compose.yml.
# The password has no default on purpose: it comes from PGPASSWORD,
# which ./scripts/init_env.sh writes to .env (load it with `set -a; . ./.env; set +a`).
learning_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '55432') | int }}"
      user: "{{ env_var('PGUSER', 'analytics') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE', 'learning') }}"
      schema: public
      threads: 4
