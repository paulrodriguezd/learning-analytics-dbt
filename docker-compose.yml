services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: analytics
      # Random password from .env, created by ./scripts/init_env.sh.
      POSTGRES_PASSWORD: ${PGPASSWORD:?Run ./scripts/init_env.sh first}
      POSTGRES_DB: learning
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d learning"]
      interval: 2s
      retries: 15
